services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tricity
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dropin
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tricity -d dropin"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://tricity:local-development-only@db:5432/dropin
      PORT: 8080
      WEB_ORIGIN: http://localhost:4200
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:4200:8080"]
    depends_on: [api]
volumes:
  postgres-data:
