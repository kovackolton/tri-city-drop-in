server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location /private-game/ { proxy_pass http://api:8080; }
  location /games/ { proxy_pass http://api:8080; }
  location /share/ { proxy_pass http://api:8080; }
  location /api/ {
    proxy_pass http://api:8080;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
