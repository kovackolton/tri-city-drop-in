# Public settings only. Replace the placeholders in your Cloud Run service.
# Supply DATABASE_URL separately using a runtime secret; never put database credentials here.
PUBLIC_SITE_ORIGIN: "https://YOUR-PUBLIC-SITE-HOST"
FIREBASE_PROJECT_ID: "YOUR-FIREBASE-PROJECT-ID"
PUBLIC_FIREBASE_CONFIG: '{"apiKey":"YOUR-PUBLIC-WEB-API-KEY","authDomain":"YOUR-PROJECT.firebaseapp.com","projectId":"YOUR-FIREBASE-PROJECT-ID","appId":"YOUR-PUBLIC-WEB-APP-ID"}'
